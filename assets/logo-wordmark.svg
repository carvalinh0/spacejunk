<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" role="img" aria-label="spacejunk">
  <!-- One mid-tone gray instead of a prefers-color-scheme switch: an <img>
       follows the OS theme, not the page's (GitHub light theme on a dark OS
       made light text vanish on white). This gray reads on both. -->
  <style>
    .name { font: 700 120px "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; letter-spacing: -2px; }
    .dim { fill: #7d869c; }
    .tag { font: 500 30px "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; fill: #7d869c; }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c3d"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
  </defs>

  <!-- icon (same drawing as logo.svg, scaled to 260px) -->
  <g transform="translate(20 20) scale(0.5078)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
    <g fill="none" stroke="#6b7590" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M112 132 V 336 Q112 360 136 360 H156"/>
      <path d="M112 200 H156"/>
      <path d="M112 280 H156"/>
    </g>
    <rect x="88" y="92" width="48" height="48" rx="12" fill="#22d3ee"/>
    <rect x="176" y="176" width="256" height="48" rx="14" fill="#ef4444"/>
    <rect x="176" y="256" width="160" height="48" rx="14" fill="#f59e0b"/>
    <rect x="176" y="336" width="80" height="48" rx="14" fill="#22c55e"/>
    <rect x="176" y="96" width="28" height="40" rx="4" fill="#e5e9f0" opacity="0.85"/>
  </g>

  <text x="320" y="170" class="name"><tspan class="dim">space</tspan><tspan fill="#ef4444">junk</tspan></text>
  <text x="324" y="228" class="tag">where did all my disk go?</text>
</svg>
