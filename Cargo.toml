[package]
name = "spacejunk"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Fast TUI disk usage analyzer: shows a tree of folders from heaviest to lightest"
license = "MIT"
readme = "README.md"
repository = "https://github.com/carvalinh0/spacejunk"
keywords = ["disk", "du", "tui", "storage", "ncdu"]
categories = ["command-line-utilities", "filesystem"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
ratatui = "0.30.2"
rayon = "1.12.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# `cargo build --profile profiling` — release speed with symbols, for perf/flamegraph.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Size/percent math intentionally converts between integers and floats for display.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cognitive_complexity = "warn"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
