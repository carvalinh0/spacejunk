# Automatic versioning + publishing with release-plz.
#
# On every push to main:
#   1. CI runs (fmt, clippy, test) on Linux, macOS and Windows.
#   2. `release-pr` opens/updates a "chore: release" PR that bumps the version
#      in Cargo.toml/Cargo.lock and updates CHANGELOG.md, based on the
#      Conventional Commits since the last release (fix: -> patch,
#      feat: -> minor, feat!: / BREAKING CHANGE -> major).
#   3. When that PR is merged, `release` sees the new version, runs
#      `cargo publish`, creates the git tag and a *draft* GitHub Release
#      (release-plz.toml: git_release_draft).
#   4. `binaries` builds every target and attaches
#      spacejunk-<tag>-<target>.tar.gz|.zip (+ .sha256) to the draft.
#      scripts/install.sh and scripts/install.ps1 download these names:
#      never rename them.
#   5. `publish-release` publishes the draft once every binary is attached.
#   6. `store-package` bundles the two Windows binaries into
#      spacejunk-<tag>.msixbundle (+ .msixupload), kept as a workflow artifact
#      (not a release asset: it is unsigned until the Store re-signs it). With
#      the STORE_* secrets set, it also submits the .msixupload to the
#      Microsoft Store; without them, upload it by hand in Partner Center.
#
# Why a draft: the repository uses immutable releases, which refuse assets
# once a release is published (v0.1.0 shipped without binaries because of
# it). Drafts are also invisible to /releases/latest, so the install scripts
# never see a release whose binaries are still building.
#
# Third-party actions are pinned to commit SHAs (tag in the comment): they
# run with write access and the crates.io token.
#
# Required secret: CARGO_REGISTRY_TOKEN (crates.io API token with scopes publish-new
# and publish-update).
# Optional secrets, all four or none: STORE_TENANT_ID, STORE_CLIENT_ID,
# STORE_CLIENT_SECRET (a Microsoft Entra app with the Manager role in Partner
# Center) and STORE_SELLER_ID.
# Required setting: Settings > Actions > General > "Allow GitHub Actions to
# create and approve pull requests".

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(echo "$RELEASES" | jq -r '.[0].tag')" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The commit release-plz just tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="spacejunk-$TAG-$TARGET.tar.gz"
          tar -C "target/$TARGET/release" -czf "$name" spacejunk
          shasum -a 256 "$name" > "$name.sha256"
          gh release upload "$TAG" "$name" "$name.sha256" --clobber
      - name: Package and upload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "spacejunk-$env:TAG-$env:TARGET.zip"
          Compress-Archive -Path "target/$env:TARGET/release/spacejunk.exe" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.sha256" -Value "$hash  $name" -Encoding ascii -NoNewline
          gh release upload $env:TAG $name "$name.sha256" --clobber

  publish-release:
    name: Publish GitHub Release
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  store-package:
    name: Microsoft Store package
    needs: [release, publish-release]
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bundle the released Windows binaries
        shell: pwsh
        run: |
          gh release download $env:TAG --pattern '*-pc-windows-msvc.zip' --dir dl
          Expand-Archive "dl/spacejunk-$env:TAG-x86_64-pc-windows-msvc.zip" x64
          Expand-Archive "dl/spacejunk-$env:TAG-aarch64-pc-windows-msvc.zip" arm64
          ./packaging/msix/pack.ps1 -Exe @{ x64 = 'x64/spacejunk.exe'; arm64 = 'arm64/spacejunk.exe' } -Out "spacejunk-$env:TAG.msixbundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spacejunk-${{ needs.release.outputs.tag }}-msixbundle
          path: |
            spacejunk-*.msixbundle
            spacejunk-*.msixupload
          if-no-files-found: error
      - name: Check for Microsoft Store credentials
        id: store
        shell: bash
        env:
          TENANT: ${{ secrets.STORE_TENANT_ID }}
        run: echo "configured=$([ -n "$TENANT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Installs the Microsoft Store Developer CLI (msstore).
      - if: steps.store.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      # Creates a submission with the new package and commits it; the Store
      # keeps the listing, age rating and everything else from the last one.
      # Certification then takes hours to a few days.
      - name: Submit to the Microsoft Store
        if: steps.store.outputs.configured == 'true'
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE) { throw 'msstore reconfigure failed' }
          msstore publish "spacejunk-$env:TAG.msixupload" --appId 9NLB9QFQQRW3
          if ($LASTEXITCODE) { throw 'msstore publish failed' }

  release-pr:
    name: Open release PR (version bump)
    # After `release`: on the very first run both raced and the PR proposed
    # a version that `release` had just published.
    needs: [ci, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release-pr
        env:
          # No registry token: release-pr only reads public crates.io data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
