name: CI

on:
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable # required when the action is pinned by SHA
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # makeappx validates the manifest and every file it references; the
      # Store bundle itself is built by release.yml from the release binaries.
      - name: Microsoft Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build
          ./packaging/msix/pack.ps1 -Exe @{ x64 = 'target/debug/spacejunk.exe' } -Out spacejunk.msixbundle

  msrv:
    # `rust-version` in Cargo.toml is what `cargo install` checks users'
    # compilers against; it once said 1.88 while sysinfo already needed 1.95.
    name: minimum Rust (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: x86_64-pc-windows-msvc
      # `check` needs no linker, so the Windows code is checked from Linux too.
      - run: cargo check --all-targets --locked
      - run: cargo check --all-targets --locked --target x86_64-pc-windows-msvc

  install-scripts:
    name: install scripts lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck scripts/install.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
