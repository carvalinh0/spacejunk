name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution yet. "When I clean up my disk I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like spacejunk to do?
      description: How it would work from your point of view (keys, screens, flags).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use today, or other tools that do this.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this was not requested yet.
          required: true
